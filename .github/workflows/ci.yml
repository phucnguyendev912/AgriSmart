name: CI (Code Validation)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-validation:
    name: Backend Validation (Java/Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        working-directory: agriai_backend/agriai
        run: |
          chmod +x mvnw
          ./mvnw clean test

  frontend-validation:
    name: Frontend Validation (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agriai_frontend/package-lock.json

      - name: Install dependencies
        working-directory: agriai_frontend
        run: npm install

      - name: Build production bundle
        working-directory: agriai_frontend
        run: npm run build

  admin-frontend-validation:
    name: Admin Frontend Validation (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agriai_admin_frontend/package-lock.json

      - name: Install dependencies
        working-directory: agriai_admin_frontend
        run: npm install

      - name: Build production bundle
        working-directory: agriai_admin_frontend
        run: npm run build
