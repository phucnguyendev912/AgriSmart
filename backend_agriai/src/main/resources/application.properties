# Cổng chạy server Backend của bạn
server.port=8080

# Cấu hình kết nối PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AgriAI_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ThienPhuc2404}
spring.datasource.driver-class-name=org.postgresql.Driver
# Tự động update bảng dựa vào class @Entity (Nên dùng lúc Dev)
spring.jpa.hibernate.ddl-auto=update

# Hiện câu lệnh SQL ra console để dễ debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === CÁC BIẾN TỰ ĐỊNH NGHĨA DƯỚI ĐÂY DÙNG @Value("${...}") ĐỂ LẤY VÀO JAVA ===
# Cấu hình bảo mật token JWT (cho quá trình Authentication)
jwt.secret=${JWT_SECRET:YourSuperSecretKeyMinimum32CharactersLong!@#}
# 60 phút = 1 giờ
jwt.accessTokenExpiration=60
# 10080 phút = 7 ngày
jwt.refreshTokenExpiration=10080

# Cấu hình con AI Chatbot bằng thư viện LangChain4j 
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:[ENCRYPTION_KEY]}
langchain4j.open-ai.chat-model.model-name=${OPENAI_MODEL:gpt-3.5-turbo}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
