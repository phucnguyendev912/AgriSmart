# Cổng chạy server Backend của bạn
server.port=8080

# Cấu hình kết nối PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AgriAI_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.accessTokenExpiration=60
jwt.refreshTokenExpiration=10080

# LLM Configuration (Aliyun Maas / OpenAI Compatible API)
llm.api.key=${LLM_API_KEY}
llm.base-url=${LLM_BASE_URL:}
llm.model.name=${LLM_MODEL:qwen-plus}
llm.recommend.batch.enabled=${LLM_RECOMMEND_BATCH_ENABLED:true}
llm.recommend.max-diseases=${LLM_RECOMMEND_MAX_DISEASES:5}
llm.recommend.temperature=${LLM_RECOMMEND_TEMPERATURE:0.1}
llm.recommend.timeout-seconds=${LLM_RECOMMEND_TIMEOUT:20}
llm.recommend.max-output-tokens=${LLM_RECOMMEND_MAX_TOKENS:2048}
llm.recommend.cooldown-seconds=${LLM_RECOMMEND_COOLDOWN:30}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dvee9ck25}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Weather API Configuration (OpenWeatherMap)
weather.api.key=${WEATHER_API_KEY}
deepseek.api.key=${DEEPSEEK_API_KEY}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
deepseek.model-name=${DEEPSEEK_MODEL:deepseek-chat}

# Vision AI Configuration (Local YOLO FastAPI)
vision.ai.url=${VISION_AI_URL:http://localhost:8010/predict}

# Skill-based Chatbot Configuration
agriai.skills.base-path=${SKILLS_BASE_PATH:./skills}
agriai.chatbot.max-context-chars=${CHATBOT_MAX_CONTEXT_CHARS:3000}
agriai.chatbot.history-size=${CHATBOT_HISTORY_SIZE:6}

# Flyway — Database Migration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Google OAuth2
google.client-id=${GOOGLE_CLIENT_ID}

# Zalo OAuth2
zalo.app-id=${ZALO_APP_ID}
zalo.app-secret=${ZALO_APP_SECRET}
zalo.redirect-uri=${ZALO_REDIRECT_URI}
