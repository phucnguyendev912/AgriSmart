# HTTP - Catch-all: block bất kỳ domain không xác định
server {
    listen 80 default_server;
    server_name _;
    return 444; # Đóng kết nối không trả gì
}

# HTTP - Tự động chuyển hướng toàn bộ traffic sang HTTPS
server {
    listen 80;
    server_name agrismart.io.vn admin.agrismart.io.vn api.agrismart.io.vn;
    return 301 https://$host$request_uri;
}

# HTTPS - Catch-all: chặn request không khớp domain nào
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    return 444;
}

# HTTPS - Trang chính (User Web App)
server {
    listen 443 ssl;
    server_name agrismart.io.vn;

    # Chứng chỉ SSL Cloudflare Origin hoặc Let's Encrypt
    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Cấu hình bảo mật SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy request thông thường tới frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests trực tiếp tới backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket kết nối trực tiếp tới backend
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

