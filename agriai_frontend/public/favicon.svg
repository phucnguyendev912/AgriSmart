<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded square background matching the logo's bg-primary/10 style but solid for favicon -->
  <rect x="0" y="0" width="32" height="32" rx="8" ry="8" fill="#00A651"/>

  <!-- Potted plant icon (simplified) matching Material Symbols "potted_plant" -->
  <!-- Pot body -->
  <path d="M10 22 L12 28 L20 28 L22 22 Z" fill="white" opacity="0.95"/>
  <!-- Pot rim -->
  <rect x="9" y="20" width="14" height="3" rx="1.5" fill="white"/>

  <!-- Stem -->
  <line x1="16" y1="20" x2="16" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Main leaf left -->
  <path d="M16 17 Q10 14 10 9 Q14 9 16 14" fill="white" opacity="0.9"/>

  <!-- Main leaf right -->
  <path d="M16 14 Q22 11 22 6 Q18 6 16 11" fill="white" opacity="0.85"/>

  <!-- Small top sprout -->
  <path d="M16 13 Q16 10 18 8" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
